<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0c890"/>
      <stop offset="100%" stop-color="#d8a870"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3c1e0a"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="hat_g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#4a2808"/>
    </linearGradient>
    <linearGradient id="top_g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a6830"/>
      <stop offset="100%" stop-color="#2a5022"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.38" cy="0.38" r="0.65">
      <stop offset="0%"   stop-color="#3a8a40"/>
      <stop offset="50%"  stop-color="#1a5020"/>
      <stop offset="100%" stop-color="#0a2010"/>
    </radialGradient>
    <radialGradient id="mush" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#e86050"/>
      <stop offset="100%" stop-color="#c03020"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.65">
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- ── FOREST GREEN TUNIC (body) ── -->
  <path d="M 0,260 L 0,215 C 28,202 55,198 70,206 L 84,220 L 100,212 L 116,220 L 130,206 C 145,198 172,202 200,215 L 200,260 Z"
        fill="url(#top_g)" stroke="#1e4018" stroke-width="1.2"/>

  <!-- ── NECK ── -->
  <path d="M 87,196 C 87,205 92,211 100,211 C 108,211 113,205 113,196 L 113,204 C 113,210 107,216 100,216 C 93,216 87,210 87,204 Z"
        fill="url(#sk)" stroke="#b07848" stroke-width="0.8"/>

  <!-- ── EARS ── -->
  <path d="M 44,130 C 38,128 35,136 36,145 C 37,154 42,158 47,156 C 52,154 53,146 51,139 Z"
        fill="#d8a870" stroke="#b07848" stroke-width="0.9"/>
  <path d="M 156,130 C 162,128 165,136 164,145 C 163,154 158,158 153,156 C 148,154 147,146 149,139 Z"
        fill="#d8a870" stroke="#b07848" stroke-width="0.9"/>

  <!-- ── FACE (rounder, chibi proportions) ── -->
  <path d="M 48,132 C 45,94 64,46 100,40 C 136,46 155,94 152,132 C 154,168 136,203 100,208 C 64,203 46,168 48,132 Z"
        fill="url(#sk)" stroke="#c07848" stroke-width="1.2"/>
  <!-- Chubby cheek blush -->
  <ellipse cx="62"  cy="148" rx="18" ry="10" fill="#e06060" opacity="0.16"/>
  <ellipse cx="138" cy="148" rx="18" ry="10" fill="#e06060" opacity="0.16"/>

  <!-- ── HAT (mushroom-inspired forest hat) ── -->
  <!-- Brim -->
  <ellipse cx="100" cy="76" rx="70" ry="14" fill="url(#hat_g)" stroke="#2a1408" stroke-width="1.2"/>
  <!-- Hat body -->
  <path d="M 46,74 C 48,44 68,14 100,10 C 132,14 152,44 154,74 Z"
        fill="url(#hat_g)" stroke="#2a1408" stroke-width="1.2"/>
  <!-- Hat texture lines -->
  <path d="M 70,72 C 72,50 82,26 100,18 C 88,28 78,50 76,72 Z" fill="#3a2008" opacity="0.25"/>
  <path d="M 130,72 C 128,50 118,26 100,18 C 112,28 122,50 124,72 Z" fill="#3a2008" opacity="0.25"/>
  <!-- Mushroom spots on hat -->
  <ellipse cx="82"  cy="38" rx="7" ry="5"  fill="#f0d8b8" opacity="0.5" transform="rotate(-15,82,38)"/>
  <ellipse cx="118" cy="34" rx="6" ry="4.5" fill="#f0d8b8" opacity="0.5" transform="rotate(12,118,34)"/>
  <ellipse cx="100" cy="22" rx="5" ry="4"  fill="#f0d8b8" opacity="0.45"/>
  <!-- Hat highlight -->
  <path d="M 88,14 C 94,10 108,11 116,16 C 107,12 95,11 88,14 Z" fill="#7a4818" opacity="0.6"/>

  <!-- ── HAIR UNDER HAT (peeking out) ── -->
  <path d="M 48,76 C 50,65 60,58 68,60 C 62,62 54,68 52,78 Z" fill="url(#h)"/>
  <path d="M 152,76 C 150,65 140,58 132,60 C 138,62 146,68 148,78 Z" fill="url(#h)"/>

  <!-- ── EYEBROWS ── (expressive, slightly up) -->
  <path d="M 62,108 C 68,102 80,100 90,103"
        fill="none" stroke="#1a0a04" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 110,103 C 120,100 132,102 138,108"
        fill="none" stroke="#1a0a04" stroke-width="3.2" stroke-linecap="round"/>

  <!-- ── EYES ── (large, bright green forest eyes) -->
  <!-- Left -->
  <ellipse cx="76" cy="128" rx="16" ry="13" fill="#fff8f0" stroke="#1a0a04" stroke-width="0.8"/>
  <ellipse cx="76" cy="129" rx="11" ry="11" fill="url(#iris)"/>
  <ellipse cx="76" cy="130" rx="6"  ry="6.5" fill="#0a2010"/>
  <ellipse cx="72" cy="124" rx="4"   ry="3"  fill="white" opacity="0.92"/>
  <ellipse cx="81" cy="133" rx="2"   ry="1.5" fill="white" opacity="0.55"/>
  <path d="M 60,120 C 66,114 86,114 92,120"
        fill="none" stroke="#0a0604" stroke-width="3" stroke-linecap="round"/>
  <!-- Right -->
  <ellipse cx="124" cy="128" rx="16" ry="13" fill="#fff8f0" stroke="#1a0a04" stroke-width="0.8"/>
  <ellipse cx="124" cy="129" rx="11" ry="11" fill="url(#iris)"/>
  <ellipse cx="124" cy="130" rx="6"  ry="6.5" fill="#0a2010"/>
  <ellipse cx="120" cy="124" rx="4"   ry="3"  fill="white" opacity="0.92"/>
  <ellipse cx="129" cy="133" rx="2"   ry="1.5" fill="white" opacity="0.55"/>
  <path d="M 108,120 C 114,114 134,114 140,120"
        fill="none" stroke="#0a0604" stroke-width="3" stroke-linecap="round"/>

  <!-- ── NOSE (small, cute) ── -->
  <path d="M 97,152 C 96,157 97,161 100,161 C 103,161 104,157 103,152"
        fill="none" stroke="#b07040" stroke-width="1.1" opacity="0.55"/>
  <ellipse cx="97"  cy="159" rx="2" ry="1.2" fill="#a06030" opacity="0.3"/>
  <ellipse cx="103" cy="159" rx="2" ry="1.2" fill="#a06030" opacity="0.3"/>

  <!-- ── MOUTH (energetic, friendly grin) ── -->
  <path d="M 82,174 C 90,183 110,183 118,174"
        fill="none" stroke="#a86040" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 84,174 C 90,180 110,180 116,174 C 110,183 90,183 84,174 Z"
        fill="white" opacity="0.5"/>
  <!-- Smile dimples -->
  <path d="M 82,174 C 80,170 78,172 80,176" fill="none" stroke="#a06038" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 118,174 C 120,170 122,172 120,176" fill="none" stroke="#a06038" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ── VIGNETTE ── -->
  <rect x="0" y="0" width="200" height="260" fill="url(#vig)"/>
</svg>
